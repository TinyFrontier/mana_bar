name: Mana
options:
  bundleIdPrefix: com.manabar
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Signing identity is pinned rather than left to "Automatic" on purpose.
    # macOS ties the Accessibility (TCC) grant to the app's code signature, and
    # letting Xcode pick whatever identity happens to be in the keychain makes
    # that signature vary between machines and between builds, silently
    # invalidating the permission the user already gave. "-" is ad-hoc: stable
    # in *identity*, but its designated requirement still pins the binary hash,
    # so a rebuild invalidates the grant anyway. Override it with a self-signed
    # certificate for a grant that survives rebuilds — see README,
    # "Accessibility during development":
    #   xcodebuild ... CODE_SIGN_IDENTITY="Mana Dev"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  Mana:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    # Recursively includes everything under Sources/, which is also where
    # Sources/Resources/Assets.xcassets (real Claude/OpenAI logos, ТЗ §3.3)
    # lives — XcodeGen auto-detects `.xcassets` as a resource folder within
    # any listed source path and wires it into the target's "Copy Bundle
    # Resources" build phase, no separate `resources:` entry needed.
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Mana
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Mana. All rights reserved."
        NSPrincipalClass: NSApplication
    entitlements:
      path: Mana.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manabar.Mana
        PRODUCT_NAME: Mana
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES
        # AppIcon.appiconset lives in Sources/Resources/Assets.xcassets
        # (Mana mark, logo-kit.html "Иконка приложения и фавикон"). actool
        # compiles it to AppIcon.icns and merges CFBundleIconName into the
        # final Info.plist even though GENERATE_INFOPLIST_FILE is NO above.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ManaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/ManaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manabar.ManaTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mana

schemes:
  Mana:
    build:
      targets:
        Mana: all
        ManaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ManaTests
    archive:
      config: Release
